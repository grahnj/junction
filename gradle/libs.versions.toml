# Version catalog is a central place for you to declare and version dependencies
# https://docs.gradle.org/current/userguide/platforms.html#sub:version-catalog
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
kotlin = "2.3.10"
kotlinxSerializationJSON = "1.9.0"
kspPlugin = "2.3.10"
ksp = "2.3.6"
springBoot4 = "4.1.1"


[libraries]
kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinxSerialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJSON" }
kspSymbolProcessing = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp"}
springBootStarter = { module = "org.springframework.boot:spring-boot-starter", version.ref = "springBoot4" }
springBootStarterWeb = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "springBoot4" }

# Libraries can be bundled together for easier import
[bundles]
kotlinxEcosystem = ["kotlinxSerialization"]
kspEcosystem = ["kspSymbolProcessing"]
springEcosystem = ["springBootStarter", "springBootStarterWeb"]

[plugins]
kotlinPluginSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "kspPlugin"}
spring = { id = "plugin.spring", version = "2.3.21"}
springBoot = { id = "org.springframework.boot", version.ref = "springBoot4"}
springDeps = { id = "io.spring.dependency-management", version = "1.1.7"}
